{% extends 'master.html' %}
{% block content%}
<!-- Contact Form Begin -->
<div class="contact-form spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="contact__form__title">
                    <h2>Post Product</h2>
                </div>
            </div>
        </div>
        <form action="{% url 'submitProduct' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-lg-6 col-md-6">
                    <select name="category" required>
                        <option value="">select category</option>
                        {% for category in allCategory %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-lg-6 col-md-6">
                    <input type="text" placeholder="Product Name" name="name" required>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12 text-center">
                    <textarea placeholder="Product Description" name="description" required></textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 col-md-6">
                    <input type="number" placeholder="Price" name="price" required>
                </div>
                <div class="col-lg-6 col-md-6">
                    <label for="">Product image</label>
                    <input type="file" placeholder="Image" name="image" required>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 col-md-6">
                    <input type="number" placeholder="Weight" name="weight" required>
                </div>
                <div class="col-lg-6 col-md-6">
                    <input type="number" placeholder="Stock" name="stock" required>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-6 col-md-6">
                    <select name="available" id="">
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
                <div class="col-lg-6 col-md-6">

                </div>
                <div class="col-lg-12 text-center">
                    <button type="submit" class="site-btn">Add Product</button>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- Contact Form End -->

{% endblock %}
