<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Receipt</title>

<style>
body{
    font-family: monospace;
    background:#eee;
}

.receipt{
    width:300px;
    background:white;
    margin:40px auto;
    padding:10px;
    border:1px solid #ccc;
}

.center{
    text-align:center;
}

hr{
    border:none;
    border-top:1px dashed black;
}

table{
    width:100%;
    font-size:14px;
}

td{
    padding:3px 0;
}

.total{
    font-weight:bold;
}

.small{
    font-size:12px;
}
</style>
</head>

<body>

<div class="receipt">

<div class="center">
<h3>MBUGUA STORE</h3>
<p class="small">
Ruiru, Kiambu<br>
Tel: 0728 627 678
</p>
</div>

<hr>

<p>
Receipt #: 10045<br>
Date: 12/03/2026<br>
Cashier: John
</p>

<hr>

<table>
<tr>
<td>Bread</td>
<td align="center">1</td>
<td align="right">60</td>
</tr>

<tr>
<td>Milk</td>
<td align="center">2</td>
<td align="right">120</td>
</tr>

<tr>
<td>Sugar</td>
<td align="center">1</td>
<td align="right">150</td>
</tr>
</table>

<hr>

<table>
<tr class="total">
<td>Total</td>
<td></td>
<td align="right">330</td>
</tr>
</table>

<hr>

<div class="center small">
Thank you for shopping!<br>
Please come again
</div>

</div>

</body>
</html>
